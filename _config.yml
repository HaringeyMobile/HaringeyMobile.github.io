title: "Haringey Mobile"
email: "haringeymobile@gmail.com"
description: "Educational and strategy games"
url: "https://haringeymobile.github.io"
baseurl: ""
logo: "/assets/images/HM.png"

theme: minima

# Jekyll behavior
markdown: kramdown
permalink: "/:categories/:year/:month/:day/:title/"

exclude:
  - "_site"
  - "Gemfile.lock"
  - ".rvmrc"
  - ".ruby-version"

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  apps:
    output: true
    permalink: "/apps/:name/"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Custom data path for app details
apps_data: "_data/apps.yml"
