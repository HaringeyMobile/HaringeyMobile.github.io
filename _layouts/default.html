<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-brand">
        {% if site.logo %}
          <a class="site-logo-link" href="/" aria-label="Haringey Mobile homepage"><img class="site-logo" src="{{ site.logo | relative_url }}" alt="{{ site.title }}" /></a>
        {% endif %}
        <div>
          <h1><a class="site-title-link" href="/">{{ site.title }}</a></h1>
          <p>{{ site.description }}</p>
        </div>
      </div>
    </header>
    <main class="content">
      {% unless page.url == '/' or page.url == '' %}
        <nav class="back-navigation" aria-label="Breadcrumb"><a href="/">← Back to Home</a></nav>
      {% endunless %}
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    </footer>
  </body>
</html>
